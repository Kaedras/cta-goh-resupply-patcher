name: Build patcher

on: push

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7

      - name: Install gcc-16
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 g++-16

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 100
          sudo update-alternatives --install /usr/bin/cc cc /usr/bin/gcc-16 100
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++-16 100

      - name: Install dependencies
        run: |
          sudo apt-get install -y libargparse-dev libspdlog-dev libzip-dev zipcmp zipmerge ziptool

      - name: Build patcher
        run: |
          cmake -B build
          cmake -build build -j $(nproc)
